product:
  type: kmp/lib
  platforms: [ jvm, linuxX64 ]

apply: [ //templates/metro.module-template.yaml ]

dependencies:
  - //lib//utils
  - //lib//core
  - //lib//spond
  - //lib//volleyzone-source
  - //lib//spond-sink
  - $libs.clikt
  - $libs.kotlinx.io.core
  - $libs.kotlinx.coroutines.core
  - $libs.kotlinx.datetime
  - $libs.kermit
  - $libs.ktor.client.core
  - $libs.ktor.client.logging
  - $libs.kotlinx.serialization.json.io
  - //lib/config

dependencies@jvm:
  - $libs.ktor.client.cio

dependencies@native:
  - $libs.ktor.client.curl

settings:
  kotlin:
    serialization: json
    optIns: [ kotlin.time.ExperimentalTime, kotlinx.serialization.ExperimentalSerializationApi ]
