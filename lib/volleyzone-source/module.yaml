product:
  type: kmp/lib
  platforms: [ jvm, linuxX64 ]

apply: [ //templates/metro.module-template.yaml ]

dependencies:
  - //lib/utils
  - //lib/core
  - $libs.kermit
  - $libs.kotlinx.datetime
  - $libs.kotlinx.coroutines.core
  - $libs.ktor.client.core
  - $libs.ksoup
  - $libs.ktor.http: exported

test-dependencies:
  - //lib/test-resources
  - $libs.kotlinx.coroutines.test
  - $libs.ktor.client.mock

settings:
  kotlin:
    optIns:
      - kotlin.time.ExperimentalTime
    serialization: json
