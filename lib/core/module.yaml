product:
  type: kmp/lib
  platforms: [ jvm, linuxX64 ]

apply: [ //templates/metro.module-template.yaml ]

dependencies:
  - //lib/utils
  - $libs.ktor.client.core
  - $libs.kermit
  - $libs.kotlinx.datetime

test-dependencies:
  - //lib/test-resources

settings:
  kotlin:
    optIns:
      - kotlin.time.ExperimentalTime
      - kotlin.uuid.ExperimentalUuidApi
    serialization: true
